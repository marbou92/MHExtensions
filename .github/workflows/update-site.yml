name: Update website index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "lib-multisrc/**"
      - ".github/scripts/generate-site-index.py"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-site
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate docs/index.json + icons
        run: python3 .github/scripts/generate-site-index.py

      # The fallback PR step (peter-evans/create-pull-request) internally does
      # `git stash push --include-untracked` -> reset base -> rebuild the branch
      # -> `git stash pop`. ANY dirty file outside docs/index.json + docs/icons
      # (e.g. EOL phantom dirt on gradlew.bat right after checkout) makes that
      # stash pop conflict and kills the job after the branch was already built.
      # Keep the tree clean except for the catalog output so the fallback path
      # is always safe.
      - name: Keep working tree clean except catalog output
        run: |
          echo "Working tree before cleanup:"
          git status --porcelain -unormal || true
          # 1) Drop every tracked modification that is not catalog output.
          git restore --worktree -- . ':(exclude)docs/index.json' ':(exclude)docs/icons' || true
          # 2) Drop untracked noise that is not catalog output.
          git clean -fd -- . ':(exclude)docs/index.json' ':(exclude)docs/icons' || true
          # 3) EOL phantom dirt survives restore (content identical, only the
          #    EOL conversion differs between worktree and index). Hide those
          #    paths from status so the stash cycle cannot trip over them.
          leftover="$(git status --porcelain -unormal -- . ':(exclude)docs/index.json' ':(exclude)docs/icons')"
          if [ -n "$leftover" ]; then
            echo "Phantom-dirty paths (marking assume-unchanged):"
            printf '%s\n' "$leftover"
            printf '%s\n' "$leftover" | sed 's/^...//' | xargs -r -d '\n' git update-index --assume-unchanged -- || true
          fi
          echo "Working tree after cleanup:"
          git status --porcelain -unormal || true

      # `main` is protected by a ruleset (PRs only + required "build" check).
      # GitHub does NOT let the built-in Actions bot (GITHUB_TOKEN) onto a
      # ruleset bypass list - it never appears in the picker. The working
      # equivalent: add "Repository admin" to the bypass list (that is you)
      # and let the bot push with YOUR personal access token via the REPO_PAT
      # secret. A PAT push counts as you, so the bypass applies, while the
      # commit itself is still authored by github-actions[bot] so the history
      # reads as automation. If REPO_PAT is not set (or the push is rejected
      # anyway), the run prints the exact setup steps and falls back to the
      # classic catalog PR below.
      - name: Push the catalog straight to main (admin PAT bypass)
        id: direct-push
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage the two outputs separately - a single `git add a b` is
          # all-or-nothing, so a missing docs/icons would silently skip the
          # catalog too.
          git add -A -- docs/index.json
          [ -d docs/icons ] && git add -A -- docs/icons || true
          if git diff --cached --quiet; then
            echo "Catalog unchanged - nothing to push."
            echo "outcome=nothing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(site): regenerate extension catalog"
          if [ -n "${REPO_PAT:-}" ]; then
            # Push as the repo admin (the PAT owner) so the ruleset bypass applies.
            git remote set-url origin "https://x-access-token:${REPO_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          if git push origin HEAD:main; then
            echo "outcome=pushed" >> "$GITHUB_OUTPUT"
            echo "Catalog pushed straight to main - the Pages site picks it up automatically."
          else
            echo "outcome=rejected" >> "$GITHUB_OUTPUT"
            # Unwind the local commit but keep the catalog diff in the working
            # tree (mixed reset; shallow-safe - HEAD~1 does not exist here) so
            # the fallback PR step can pick it up.
            git reset origin/main
            # Hand the fallback path back to the default GITHUB_TOKEN
            # credentials so a broken/expired PAT can never affect it.
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
            if [ -z "${REPO_PAT:-}" ]; then
              echo "::warning::Push to main was rejected - the PAT bypass is not configured yet."
              echo "GitHub does not let the built-in Actions bot onto a ruleset bypass list (it"
              echo "never shows up in the picker), so the one-time setup is:"
              echo "  1. Settings -> Rules -> Rulesets -> (your main ruleset) -> Bypass list ->"
              echo "     Add bypass target -> 'Repository admin' -> Save changes."
              echo "  2. Create the token — a CLASSIC token with the 'repo' scope works as-is;"
              echo "     a fine-grained token (this repo only, Permissions -> Contents: Read"
              echo "     and write) works too."
              echo "  3. Settings -> Secrets and variables -> Actions -> New repository secret:"
              echo "     Name REPO_PAT, value = the token. Then re-run this job."
              echo "Until then the catalog lands as a PR you merge by hand."
            else
              echo "::warning::Push to main was rejected even with REPO_PAT set. Check:"
              echo "  1. the main ruleset bypass list still contains 'Repository admin';"
              echo "  2. the PAT is not expired (classic tokens: 'repo' scope is enough;"
              echo "     fine-grained: this repo + Contents: Read and write)."
              echo "Falling back to the classic catalog PR."
            fi
          fi

      # After a successful direct push the old catalog PR (if one is still open
      # from before the bypass was configured) is redundant - close it and
      # delete its branch so nothing stale lingers around.
      - name: Close stale catalog PR
        if: steps.direct-push.outputs.outcome == 'pushed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr close chore/site-catalog --delete-branch 2>/dev/null; then
            echo "Closed the stale chore/site-catalog PR and deleted its branch."
          else
            echo "No open catalog PR to close - nothing to clean up."
          fi

      # Reached only when the direct push is not possible yet (no REPO_PAT or
      # the push was rejected). Opens/refreshes chore/site-catalog the classic
      # way; you merge it by hand after the required "build" check goes green.
      - name: Fallback - open or refresh the catalog PR
        id: catalog-pr
        if: steps.direct-push.outputs.outcome == 'rejected'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/site-catalog
          delete-branch: true
          base: main
          title: "chore(site): regenerate extension catalog"
          commit-message: "chore(site): regenerate extension catalog"
          body: |
            Automated catalog regeneration by the **Update website index** workflow.

            - Updates `docs/index.json` (+ `docs/icons/`) from the current `src/` tree
            - The direct push to `main` was rejected because the PAT bypass is not
              configured yet — so this lands as a PR.

            **Make it automatic (one-time):** the built-in Actions bot cannot be added to
            a ruleset bypass list (it never shows up in the picker), so instead:
            Rules → Rulesets → (the main ruleset) → Bypass list → add **Repository admin**;
            then store a PAT as the repo secret **REPO_PAT** — a classic token with the
            'repo' scope works as-is (fine-grained: this repo only + Contents: Read and
            write). Re-run Update website index and the catalog will
            push straight to main.
          labels: |
            automated
            site
          add-paths: |
            docs/index.json
            docs/icons

      - name: Catalog status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          outcome="${{ steps.direct-push.outputs.outcome }}"
          if [ "$outcome" = "pushed" ]; then
            echo "Catalog pushed straight to main."
            exit 0
          fi
          if [ "$outcome" = "nothing" ]; then
            echo "Catalog unchanged - nothing to do."
            exit 0
          fi
          url="${{ steps.catalog-pr.outputs.pull-request-url }}"
          if [ -n "$url" ]; then
            echo "Direct push rejected - catalog PR ready (merge by hand once the build check is green): $url"
            exit 0
          fi
          if gh pr view chore/site-catalog --json url -q .url 2>/dev/null; then
            exit 0
          fi
          if git ls-remote --heads origin chore/site-catalog | grep -q .; then
            echo "::warning::chore/site-catalog is pushed but no PR exists for it."
            echo "If the run failed at PR creation with 'GitHub Actions is not permitted to create or approve pull requests':"
            echo "  Repo Settings -> Actions -> General -> Workflow permissions ->"
            echo "  check 'Allow GitHub Actions to create and approve pull requests', Save, then re-run."
            echo "Manual fallback: ${{ github.server_url }}/${{ github.repository }}/pull/new/chore/site-catalog"
          else
            echo "Catalog unchanged - nothing to do."
          fi
