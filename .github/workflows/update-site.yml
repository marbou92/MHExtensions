name: Update website index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "lib-multisrc/**"
      - ".github/scripts/generate-site-index.py"

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate docs/index.json + icons
        run: python3 .github/scripts/generate-site-index.py

      - name: Commit regenerated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.json docs/icons
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "chore(site): regenerate extension catalog"
            git push
          fi
