name: Update website index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "lib-multisrc/**"
      - ".github/scripts/generate-site-index.py"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-site
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate docs/index.json + icons
        run: python3 .github/scripts/generate-site-index.py

      # create-pull-request internally does `git stash push --include-untracked`
      # -> reset base -> rebuild the branch -> `git stash pop`. ANY dirty file
      # outside docs/index.json + docs/icons (e.g. EOL phantom dirt reported on
      # gradlew.bat right after checkout) makes that stash pop conflict and kills
      # the job after the branch was already built. Keep the tree clean except
      # for the catalog output.
      - name: Keep working tree clean except catalog output
        run: |
          echo "Working tree before cleanup:"
          git status --porcelain -unormal || true
          # 1) Drop every tracked modification that is not catalog output.
          git restore --worktree -- . ':(exclude)docs/index.json' ':(exclude)docs/icons' || true
          # 2) Drop untracked noise that is not catalog output.
          git clean -fd -- . ':(exclude)docs/index.json' ':(exclude)docs/icons' || true
          # 3) EOL phantom dirt survives restore (content identical, only the
          #    EOL conversion differs between worktree and index). Hide those
          #    paths from status so the stash cycle cannot trip over them.
          leftover="$(git status --porcelain -unormal -- . ':(exclude)docs/index.json' ':(exclude)docs/icons')"
          if [ -n "$leftover" ]; then
            echo "Phantom-dirty paths (marking assume-unchanged):"
            printf '%s\n' "$leftover"
            printf '%s\n' "$leftover" | sed 's/^...//' | xargs -r -d '\n' git update-index --assume-unchanged -- || true
          fi
          echo "Working tree after cleanup:"
          git status --porcelain -unormal || true

      # `main` is protected by a ruleset (pull requests only + required "build"
      # status check), so the bot cannot push the catalog directly. Instead it
      # opens/refreshes a PR; the PR runs the "PR check" workflow (whose
      # aggregate "build" check satisfies the ruleset) and merges itself via
      # auto-merge the moment that check is green (see the step below).
      - name: Open or refresh the catalog PR
        id: catalog-pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/site-catalog
          delete-branch: true
          base: main
          title: "chore(site): regenerate extension catalog"
          commit-message: "chore(site): regenerate extension catalog"
          body: |
            Automated catalog regeneration by the **Update website index** workflow.

            - Updates `docs/index.json` (+ `docs/icons/`) from the current `src/` tree
            - `main` is protected (PRs only + required `build` check), so this lands as a PR

            Auto-merge is queued on this PR: it merges itself as soon as the
            required `build` check passes. (If auto-merge is disabled in repo
            settings, merge it by hand after the check goes green.)
            The GitHub Pages site picks up the new catalog automatically after merge.
          labels: |
            automated
            site
          add-paths: |
            docs/index.json
            docs/icons

      # Queue the catalog PR for auto-merge. This removes the manual merge step
      # AND the clash where the PR sits "Merging is blocked" while the required
      # `build` check runs (or while a later run force-pushes the branch):
      # GitHub merges the PR by itself the instant the check passes.
      # Runs on every execution (not just when the PR step touched the PR) so a
      # PR that already exists with an unchanged tree still gets queued.
      # Needs the one-time repo setting:
      #   Settings -> General -> Pull Requests -> Allow auto-merge
      # If that setting is off (or the ruleset blocks it) the PR simply stays
      # open for a manual merge after the check goes green.
      - name: Queue the catalog PR for auto-merge
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh pr view chore/site-catalog --json state -q .state 2>/dev/null || true)"
          if [ "$state" != "OPEN" ]; then
            echo "No open catalog PR (state: ${state:-none}) - nothing to queue."
            exit 0
          fi
          err=$(mktemp)
          if gh pr merge chore/site-catalog --auto --squash 2>"$err"; then
            echo "Auto-merge queued: the catalog PR merges by itself once the required 'build' check passes."
          elif [ "$(gh pr view chore/site-catalog --json autoMergeRequest -q .autoMergeRequest.enabled 2>/dev/null)" = "true" ]; then
            echo "Auto-merge already queued on the catalog PR - nothing to do."
          else
            echo "::warning::Could not queue auto-merge: $(tr '\n' ' ' < "$err")"
            echo "Enable it once in: Settings -> General -> Pull Requests -> check 'Allow auto-merge'."
            echo "Until then, merge the catalog PR by hand after the 'build' check goes green."
          fi
          rm -f "$err"

      # Always report where the catalog stands, so a blocked PR creation is
      # self-explanatory in the run log instead of a bare 403 from the API.
      - name: Catalog PR status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${{ steps.catalog-pr.outputs.pull-request-url }}"
          if [ -n "$url" ]; then
            echo "Catalog PR ready: $url"
            exit 0
          fi
          if gh pr view chore/site-catalog --json url -q .url 2>/dev/null; then
            exit 0
          fi
          if git ls-remote --heads origin chore/site-catalog | grep -q .; then
            echo "::warning::chore/site-catalog is pushed but no PR exists for it."
            echo "If this run failed with 'GitHub Actions is not permitted to create or approve pull requests':"
            echo "  Repo Settings -> Actions -> General -> Workflow permissions ->"
            echo "  check 'Allow GitHub Actions to create and approve pull requests', Save, then re-run this job."
            echo "Manual fallback: ${{ github.server_url }}/${{ github.repository }}/pull/new/chore/site-catalog"
          else
            echo "Catalog unchanged - nothing to propose."
          fi
